<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-icon.png" />
    <script>
      try {
        var saved = localStorage.getItem('color-scheme');
        if (saved === 'dark' || saved === 'light') {
          document.querySelector('meta[name="color-scheme"]').setAttribute('content', saved);
          document.documentElement.dataset.theme = saved;
        } else {
          var raw = localStorage.getItem('cognito_clone_v1');
          if (raw) {
            var parsed = JSON.parse(raw);
            var activeId = parsed.activeProfileId;
            var prof = (parsed.profiles || []).find(function (p) { return p.id === activeId; });
            if (prof && prof.preferences && typeof prof.preferences.darkMode === 'boolean') {
              var mode = prof.preferences.darkMode ? 'dark' : 'light';
              document.querySelector('meta[name="color-scheme"]').setAttribute('content', mode);
              document.documentElement.dataset.theme = mode;
            }
          }
        }
      } catch (e) {}
    </script>
    <title>Dashboard — Cognito</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://i.ytimg.com" crossorigin />
    <link rel="preconnect" href="https://www.youtube-nocookie.com" />
    <link rel="dns-prefetch" href="https://s.ytimg.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:ital,wght@0,400..900;1,400..700&family=Petrona:ital,wght@0,400..700;1,400..600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
